name: GreedyFTL host tests

on:
  push:
    paths:
      - "source/software/GreedyFTL-3.0.0/**"
      - ".github/workflows/firmware-tests.yml"
  pull_request:
    paths:
      - "source/software/GreedyFTL-3.0.0/**"
      - ".github/workflows/firmware-tests.yml"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y lcov cmake
      - name: Configure
        run: cmake -S source/software/GreedyFTL-3.0.0/test -B source/software/GreedyFTL-3.0.0/test/build
      - name: Build
        run: cmake --build source/software/GreedyFTL-3.0.0/test/build -j
      - name: Unit tests
        run: ctest --test-dir source/software/GreedyFTL-3.0.0/test/build --output-on-failure
      - name: Coverage
        run: cmake --build source/software/GreedyFTL-3.0.0/test/build --target coverage
      - name: Add coverage report to summary
        if: always()
        run: |
          if [ -f source/software/GreedyFTL-3.0.0/test/build/coverage/summary.txt ]; then
            cat source/software/GreedyFTL-3.0.0/test/build/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f source/software/GreedyFTL-3.0.0/test/build/coverage/per_file.md ]; then
            cat source/software/GreedyFTL-3.0.0/test/build/coverage/per_file.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greedyftl-coverage-html
          path: source/software/GreedyFTL-3.0.0/test/build/coverage/html
